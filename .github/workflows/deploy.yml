name: Build and deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".gitmodules"
      - "backend"
      - "docker-compose.yml"
      - "frontend/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".gitmodules"
      - "backend"
      - "docker-compose.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FRONTEND_IMAGE: ghcr.io/guilleinc/pets-app-frontend
  BACKEND_IMAGE: ghcr.io/guilleinc/pets-app-backend

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: frontend-checks
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VITE_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure SSH known hosts
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Create deployment directory
        run: ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p /opt/pets-app"

      - name: Copy Compose configuration
        run: scp docker-compose.yml "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/pets-app/docker-compose.yml"

      - name: Log in to GHCR on EC2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Pull and start release on EC2
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$APP_DOMAIN" ]; then
            echo "APP_DOMAIN secret is not configured"
            exit 1
          fi

          if [ -z "$JWT_SECRET_KEY" ]; then
            echo "JWT_SECRET_KEY secret is not configured"
            exit 1
          fi

          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<EOF
          set -eu
          cd /opt/pets-app
          cat > .env <<ENV
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          APP_DOMAIN=$APP_DOMAIN
          JWT_SECRET_KEY=$JWT_SECRET_KEY
          ENV
          docker compose pull
          docker compose up -d --no-build --remove-orphans
          docker image prune -af --filter "until=168h"
          EOF
