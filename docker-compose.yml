services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/guilleinc/pets-app-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    volumes:
      - backend-data:/data
      - backend-uploads:/uploads

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/guilleinc/pets-app-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  backend-data:
  backend-uploads:
  caddy-data:
  caddy-config:
